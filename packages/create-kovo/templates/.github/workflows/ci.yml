name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pin every executable action by commit so a mutable tag cannot replace CI code
      # after review (SPEC §2 supply-chain default-deny).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Do not leave the short-lived repository token in git configuration for
          # dependency hooks or project tests to recover during pull-request CI.
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1
        with:
          # Match the default Postgres starter's declared production runtime floor.
          node-version: 24.10.0
      # Restore only TypeScript's incremental build-info. Compiler and static-security facts stay
      # process-private and are never accepted from an app-writable cross-run cache (SPEC §2).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .kovo/cache/*.tsbuildinfo
          key: kovo-tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kovo-tsc-${{ runner.os }}-
      # Bootstrap without dependency lifecycle scripts, authenticate the framework-owned policy,
      # then rebuild only the exact reviewed allowlist. No app-copied policy program runs here.
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm exec kovo check lifecycle
      - run: corepack pnpm rebuild
      # The app-facing loop is entirely Kovo-owned: type/lint, the strict TypeScript subset, and
      # current-source proof run without requiring deployment posture.
      - run: corepack pnpm run check
      # Deployment proof stays explicit: this additionally enforces preset, least-privilege,
      # artifact, and SPEC §14 retention/KV417 posture.
      - run: corepack pnpm run build:prod
      # The public app-inferred harness verifies the completed graph's app identity and source,
      # config, posture, compiler, and lockfile digests before any test request is sent.
      - run: corepack pnpm run test
      # This probe starts the emitted production server, so it follows a successful deployment build.
      - run: corepack pnpm run check:endpoint-posture
