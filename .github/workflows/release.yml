name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in public package manifests, for example 0.2.0
        required: true
        type: string
      dist_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      dry_run:
        description: Build and pack without publishing
        required: true
        default: true
        type: boolean
      external_evaluator_evidence_base64:
        description: Canonical base64 N=3 signed evaluator transcript JSON (maximum 48 KiB)
        required: true
        type: string
permissions:
  contents: read

env:
  NODE_OPTIONS: --experimental-transform-types --disable-warning=ExperimentalWarning

concurrency:
  group: release-dispatch
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      ci-run-id: ${{ steps.authorize-release.outputs.ci-run-id }}
      devex-run-id: ${{ steps.authorize-release.outputs.devex-run-id }}
    steps:
      - name: Authorize exact main commit
        id: authorize-release
        # No checkout, repository program, dependency setup, release
        # environment, or OIDC permission exists in this job. Only the pinned
        # workflow statement may authorize the later release job.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = refs/heads/main
          check_run="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?check_name=check&filter=latest&per_page=100" |
              jq -ce --arg sha "$RELEASE_SHA" '
                [
                  .check_runs[]
                  | select(
                      .name == "check"
                      and .status == "completed"
                      and .conclusion == "success"
                      and .head_sha == $sha
                      and .app.id == 15368
                      and .app.slug == "github-actions"
                      and .app.owner.id == 9919
                      and .app.owner.login == "github"
                    )
                ]
                | if length == 1 then .[0] else error("expected one trusted aggregate check") end
              '
          )"
          check_suite_id="$(jq -er '.check_suite.id' <<<"$check_run")"
          workflow_run="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/293607412/runs?branch=main&event=push&head_sha=${RELEASE_SHA}&status=completed&per_page=100" |
              jq -ce \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg sha "$RELEASE_SHA" \
                --argjson suite "$check_suite_id" '
                  [
                    .workflow_runs[]
                    | select(
                        .workflow_id == 293607412
                        and .check_suite_id == $suite
                        and .event == "push"
                        and .head_branch == "main"
                        and .head_sha == $sha
                        and .path == ".github/workflows/ci.yml"
                        and .status == "completed"
                        and .conclusion == "success"
                        and .repository.full_name == $repo
                        and .head_repository.full_name == $repo
                      )
                  ]
                  | if length == 1 then .[0] else error("expected one trusted aggregate workflow run") end
                '
          )"
          devex_workflow_run="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/322844190/runs?branch=main&head_sha=${RELEASE_SHA}&status=completed&per_page=100" |
              jq -ce \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg sha "$RELEASE_SHA" '
                  [
                    .workflow_runs[]
                    | select(
                        .workflow_id == 322844190
                        and (.event == "workflow_dispatch" or .event == "schedule")
                        and .head_branch == "main"
                        and .head_sha == $sha
                        and .path == ".github/workflows/devex-nightly.yml"
                        and .status == "completed"
                        and .conclusion == "success"
                        and .repository.full_name == $repo
                        and .head_repository.full_name == $repo
                      )
                  ]
                  | sort_by(.id)
                  | if length >= 1 then .[-1] else error("expected a trusted exact-SHA DevEx Nightly run") end
                '
          )"
          printf 'ci-run-id=%s\n' "$(jq -er '.id' <<<"$workflow_run")" >> "$GITHUB_OUTPUT"
          printf 'devex-run-id=%s\n' "$(jq -er '.id' <<<"$devex_workflow_run")" >> "$GITHUB_OUTPUT"

  prepare:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      checks: read
      contents: read
    outputs:
      unverified-artifact-id: ${{ steps.upload-unverified-release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/kovo-release-pnpm

      - name: Verify release input
        # The no-checkout authorize job already bound this release to the
        # exact successful main CI run. This repository validator independently
        # checks package versions, the trusted check app, and public-registry
        # state before install/build code runs (SPEC §2 default-deny).
        run: node scripts/verify-release-input.mjs "$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          KOVO_NPM_EXECUTABLE: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin/npm
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin
          REQUIRED_RELEASE_CHECKS: check
          VERSION: ${{ inputs.version }}

      - run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          "$KOVO_RELEASE_PNPM_CLI" install --frozen-lockfile
        env:
          COREPACK_HOME: ${{ runner.temp }}/kovo-corepack-pnpm-10.12.1
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin

      - name: Prove declared grammar containment model
        run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          "$KOVO_RELEASE_PNPM_CLI" run check:grammar-containment
        env:
          COREPACK_HOME: ${{ runner.temp }}/kovo-corepack-pnpm-10.12.1
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin

      - name: Run deterministic release security fuzz campaign
        run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          "$KOVO_RELEASE_PNPM_CLI" run test:security-fuzz-release
        env:
          COREPACK_HOME: ${{ runner.temp }}/kovo-corepack-pnpm-10.12.1
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin

      - name: Archive release security fuzz counterexamples
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: ignore
          name: kovo-release-security-fuzz-failures-${{ github.sha }}
          path: .kovo/security-failures/**
          retention-days: 30

      - name: Supply-chain policy gates
        run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          "$KOVO_RELEASE_PNPM_CLI" run check:supply-chain
        env:
          COREPACK_HOME: ${{ runner.temp }}/kovo-corepack-pnpm-10.12.1
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin

      - name: Build and verify packed publish artifacts
        run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          "$KOVO_RELEASE_PNPM_CLI" run check:publish
        env:
          COREPACK_HOME: ${{ runner.temp }}/kovo-corepack-pnpm-10.12.1
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin

      - name: Require preregistered external evaluator evidence
        # This release-only capstone gate re-authenticates the current packed
        # bytes and requires three non-author signed journeys against that exact
        # HEAD. Missing evidence remains a hard failure; ordinary pull requests
        # do not run it.
        run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          "$KOVO_RELEASE_PNPM_CLI" run check:external-evaluator-evidence
        env:
          COREPACK_HOME: ${{ runner.temp }}/kovo-corepack-pnpm-10.12.1
          KOVO_EXTERNAL_EVALUATOR_EVIDENCE_BASE64: ${{ inputs.external_evaluator_evidence_base64 }}
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin

      - name: Archive verified external evaluator evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: kovo-external-evaluator-evidence-${{ github.sha }}
          path: .release/devex/external-evaluators/transcripts.json
          retention-days: 90

      - name: Upload bounded untrusted release producer files
        id: upload-unverified-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kovo-release-unverified-${{ github.sha }}
          path: |
            .release/packed-packages.json
            .release/tarballs/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  seal-release:
    needs:
      - authorize
      - prepare
    runs-on: ubuntu-latest
    env:
      BASH_ENV: ''
      ENV: ''
      NODE_OPTIONS: ''
      PATH: /usr/bin:/bin
    permissions:
      actions: read
      contents: read
    outputs:
      release-artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/kovo-release-node
      - name: Verify fresh exact release checkout
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(/usr/bin/git status --porcelain --untracked-files=all)"
          test ! -e "$GITHUB_WORKSPACE/.release"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.prepare.outputs.unverified-artifact-id }}
          path: ${{ runner.temp }}/kovo-release-unverified
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kovo-reproducible-pack-attestation
          path: ${{ runner.temp }}/kovo-reproducible-pack
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize.outputs.ci-run-id }}
      - name: Seal bounded producer files into an exact release payload
        env:
          UNVERIFIED_RELEASE_ROOT: ${{ runner.temp }}/kovo-release-unverified/kovo-release-unverified-${{ github.sha }}
        run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          scripts/verify-packed-release-payload.mjs
          --input "$UNVERIFIED_RELEASE_ROOT"
      - name: Bind producer payload to exact source and two-build CI subjects
        env:
          REPRODUCIBLE_PACK_ATTESTATION: ${{ runner.temp }}/kovo-reproducible-pack/reproducible-pack-attestation.json
        run: |
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node" \
            scripts/verify-reproducible-release-subjects.mjs \
            --attestation "$REPRODUCIBLE_PACK_ATTESTATION" \
            --source "$GITHUB_SHA"
      - name: Validate the final packed-package certificate
        run: >-
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node"
          scripts/verify-packed-release-certificate.mjs
      - name: Archive exact verified release payload
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/kovo-release-${{ github.sha }}.tgz
        run: /usr/bin/tar --create --gzip --file "$RELEASE_ARCHIVE" --directory "$GITHUB_WORKSPACE" .release
      - name: Upload exact verified release archive
        id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kovo-release-${{ github.sha }}
          path: ${{ runner.temp }}/kovo-release-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  attest-release-archive:
    if: ${{ !inputs.dry_run }}
    needs: seal-release
    runs-on: ubuntu-latest
    env:
      BASH_ENV: ''
      ENV: ''
      NODE_OPTIONS: ''
      PATH: /usr/bin:/bin
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download exact verified release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.seal-release.outputs.release-artifact-id }}
          path: ${{ runner.temp }}/kovo-release-attestation

      - name: Attest exact verified release archive
        # The immutable workflow artifact is the single inter-job subject. Its
        # packed manifest retains the per-package canonical tarball integrities
        # that the OIDC publish job independently revalidates before publishing.
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: kovo-release-${{ github.sha }}.tgz
          subject-path: ${{ runner.temp }}/kovo-release-attestation/kovo-release-${{ github.sha }}/kovo-release-${{ github.sha }}.tgz

  attest-committed-evidence:
    if: ${{ !inputs.dry_run }}
    needs: seal-release
    runs-on: ubuntu-latest
    env:
      BASH_ENV: ''
      ENV: ''
      NODE_OPTIONS: ''
      PATH: /usr/bin:/bin
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Attest exact advisory feed
        # This OIDC job reads reviewed files from the authorized main commit. It performs no
        # dependency installation, build, script execution, or long-lived key handling.
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: security/advisories/feed.json
          subject-path: security/advisories/feed.json

      - name: Attest exact certificate reviewer policy
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: security/kovo-certificate-policy-v1.json
          subject-path: security/kovo-certificate-policy-v1.json

      - name: Attest exact framework certificate
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: security/kovo-certificate-v1.json
          subject-path: security/kovo-certificate-v1.json

  publish:
    if: ${{ !inputs.dry_run }}
    needs:
      - authorize
      - seal-release
      - attest-release-archive
      - attest-committed-evidence
    runs-on: ubuntu-latest
    env:
      BASH_ENV: ''
      ENV: ''
      NODE_OPTIONS: ''
      PATH: /usr/bin:/bin
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/kovo-release-node

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.seal-release.outputs.release-artifact-id }}
          path: ${{ runner.temp }}/kovo-release-artifact

      - name: Verify trusted-publishing npm CLI
        run: |
          npm_version="$("$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/npm" --version)"
          "$RUNNER_TEMP/node-v24.18.0-linux-x64/bin/node" -e '
            const actual = process.argv[1].split(".").map(Number);
            const [major = 0, minor = 0, patch = 0] = actual;
            const supported = actual.length >= 3 && actual.every(Number.isInteger) &&
              (major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))));
            if (!supported) throw new Error(`npm >=11.5.1 is required; received ${process.argv[1]}`);
          ' "$npm_version"

      - name: Restore exact verified release payload
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/kovo-release-artifact/kovo-release-${{ github.sha }}/kovo-release-${{ github.sha }}.tgz
        run: |
          set -euo pipefail
          tar --list --gzip --file "$RELEASE_ARCHIVE" |
            awk '
              BEGIN { count = 0 }
              {
                member = $0
                count += 1
                if (member == "" || member ~ /^\// || index(member, "\\") != 0) exit 1
                if (member != ".release" && member != ".release/" && index(member, ".release/") != 1) exit 1
                segments = split(member, segment, "/")
                for (index_ = 1; index_ <= segments; index_ += 1) {
                  if (segment[index_] == ".." || (segment[index_] == "." && index_ != 1)) exit 1
                  if (segment[index_] == "" && index_ != segments) exit 1
                }
              }
              END { if (count == 0) exit 1 }
            '
          tar --list --verbose --gzip --file "$RELEASE_ARCHIVE" |
            awk 'substr($1, 1, 1) != "-" && substr($1, 1, 1) != "d" { exit 1 }'
          tar --extract --gzip --file "$RELEASE_ARCHIVE" --directory "$GITHUB_WORKSPACE"

      - name: Publish packed packages
        # This job has OIDC authority, so it deliberately performs no dependency
        # install, repository build, or package lifecycle step. The publisher
        # revalidates the prepared manifest, tarball identities, and sha512 bytes.
        run: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin/node scripts/publish-packed-packages.mjs --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          KOVO_NPM_EXECUTABLE: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin/npm
          PATH: ${{ runner.temp }}/node-v24.18.0-linux-x64/bin:/usr/bin:/bin
          NPM_CONFIG_PROVENANCE: 'true'
