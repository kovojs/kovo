name: Perf Realistic Tier

# The second of the two budget tiers decision D13 calls for (plans/good-perf.md O17).
#
# `devex-budgets.json` is the toy tier: 4 files, 56 LOC, one route, ratifiable, runner-pinned, cheap
# enough for every PR — and structurally unable to observe anything that scales with app size, which
# is why the quadratic `kovo check` term and the KV448 import wall both shipped while it stayed
# green. This workflow is the other tier. Its workload's module count is a parameter, and it is
# ALLOWED TO FAIL LOUDLY: it is not a release gate and it blocks nothing.
#
# The deterministic byte gate and a bounded matched-fixture correctness smoke run on every PR.
# N=216 check/dev/build, browser, and throughput measurements remain scheduled: every job records
# its exact runner-image/host fingerprint and reports `unproven` above the load ceiling. Raw reports
# are retained even on failure; no dirty, null, wrong-posture, short, or identity-mismatched run can
# update a reviewed budget (plans/good-perf.md Phase 4).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      measurement_scope:
        description: Select publishable baseline matrices, candidate decisions, or both
        required: true
        default: baselines
        type: choice
        options:
          - baselines
          - decisions
          - all
      decision_focus:
        description: Select one candidate decision, or all candidate decisions
        required: true
        default: all
        type: choice
        options:
          - all
          - check-watch
          - loader
          - dev-generation
          - build-source-trust
          - compressed-cache
          - cli-startup
          - runtime-diagnostics
          - dev-profile
          - build-profile
      check_watch_baseline_sha:
        description: Exact clean sealed baseline commit; required when decisions run
        required: false
        type: string
      check_watch_candidate_sha:
        description: Exact clean sealed candidate commit; required when decisions run
        required: false
        type: string
      loader_baseline_sha:
        description: Exact loader candidate parent; required when decisions run
        required: false
        type: string
      loader_candidate_sha:
        description: Exact loader production candidate; required when decisions run
        required: false
        type: string
      components:
        description: Component count for the byte suite
        required: false
        default: '24'
        type: string
      ladder:
        description: Component-count ladder for the check-scaling suite
        required: false
        default: '8,24,72,216'
        type: string

permissions:
  contents: read

concurrency:
  # A manual dispatch or maintainer-applied perf-measure label is an explicitly requested evidence
  # sample, so independent samples use their run IDs. Schedule and ordinary PR runs retain the ref
  # key and therefore serialize with an earlier run for that ref instead of adding host contention.
  group: perf-realistic-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'perf-measure-'))) && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  # pull_request's github.sha is the synthetic merge commit. Measurements instead execute the
  # immutable feature-head subject while retaining GITHUB_SHA separately as the event identity.
  KOVO_PERF_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  NODE_OPTIONS: --experimental-transform-types --disable-warning=ExperimentalWarning
  PLAYWRIGHT_VERSION: 1.60.0

jobs:
  correctness-smoke:
    name: Matched fixture correctness
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Install isolated benchmark dependencies
        run: |
          vp exec pnpm --dir benchmarks/nextjs install --ignore-workspace --frozen-lockfile
          vp exec pnpm --dir benchmarks/harness install --ignore-workspace --frozen-lockfile
      - uses: ./.github/actions/playwright-install
        with:
          browsers: chromium
          cache-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      - name: Prove both emitted matched L0/L1 behaviors
        run: >-
          vp exec node benchmarks/compare.mjs
          --cells browser
          --lanes matched-l0,matched-l1
          --iterations 2
          --warmups 0
          --skip-lighthouse
          --bfcache-iterations 2
          --out-dir "$RUNNER_TEMP/kovo-perf/correctness-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-correctness-smoke
          path: ${{ runner.temp }}/kovo-perf/correctness-smoke
          retention-days: 14

  bytes:
    name: Production bytes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Measure critical-path, navigation and bootstrap bytes
        # Dispatch inputs reach the command through env, never through direct `${{ }}`
        # interpolation into the shell (rules/github-workflows.md).
        env:
          KOVO_PERF_COMPONENTS: ${{ inputs.components || '24' }}
        run: >-
          vp exec node scripts/perf-gate.mjs
          --suite bytes
          --components "$KOVO_PERF_COMPONENTS"
          --out "$RUNNER_TEMP/kovo-perf/bytes.json"
      # Separated from the measurement so a build or boot failure is distinguishable from a budget
      # failure: the suite exits non-zero on the former and this step is what reports the latter.
      - name: Evaluate against perf-budgets.json
        # `shell: bash` runs with `set -eo pipefail`, so a budget failure survives the `| tee` pipe.
        # Without it the pipeline's exit status is tee's and a violation reports green.
        shell: bash
        run: >-
          vp exec node scripts/perf-gate.mjs
          --evaluate "$RUNNER_TEMP/kovo-perf/bytes.json"
          | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-bytes
          path: ${{ runner.temp }}/kovo-perf/bytes.json
          retention-days: 14

  check-scaling:
    name: Check scaling
    if: >-
      ${{ github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'baselines' || inputs.measurement_scope == 'all')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'perf-measure-baselines') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      # The gated statistic is the growth exponent between the two largest rungs, which is a ratio
      # taken within a single session, so it survives a contended runner far better than any
      # absolute duration would. Peak RSS is also collected here and has the least headroom of any
      # budget in the file (3.4%) — see its rationale in perf-budgets.json.
      - name: Run the kovo check component-count ladder
        # Dispatch inputs reach the command through env, never through direct `${{ }}`
        # interpolation into the shell (rules/github-workflows.md).
        env:
          KOVO_PERF_LADDER: ${{ inputs.ladder || '8,24,72,216' }}
        run: >-
          vp exec node scripts/perf-gate.mjs
          --suite check-scaling
          --ladder "$KOVO_PERF_LADDER"
          --samples 1
          --out "$RUNNER_TEMP/kovo-perf/check-scaling.json"
      - name: Evaluate against perf-budgets.json
        # `shell: bash` runs with `set -eo pipefail`, so a budget failure survives the `| tee` pipe.
        # Without it the pipeline's exit status is tee's and a violation reports green.
        shell: bash
        run: >-
          vp exec node scripts/perf-gate.mjs
          --evaluate "$RUNNER_TEMP/kovo-perf/check-scaling.json"
          | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-check-scaling
          path: ${{ runner.temp }}/kovo-perf/check-scaling.json
          retention-days: 90

  browser-matrix:
    name: Browser matrix
    if: >-
      ${{ github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'baselines' || inputs.measurement_scope == 'all')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'perf-measure-baselines') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      - name: Install isolated benchmark dependencies
        run: |
          vp exec pnpm --dir benchmarks/nextjs install --ignore-workspace --frozen-lockfile
          vp exec pnpm --dir benchmarks/harness install --ignore-workspace --frozen-lockfile
      - uses: ./.github/actions/playwright-install
        with:
          browsers: chromium
          cache-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ hashFiles('pnpm-lock.yaml', 'benchmarks/harness/pnpm-lock.yaml') }}
          restore-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      - name: Collect default and matched browser evidence
        run: >-
          vp exec node benchmarks/compare.mjs
          --cells browser
          --iterations 30
          --warmups 3
          --lighthouse-runs 5
          --bfcache-iterations 10
          --out-dir "$RUNNER_TEMP/kovo-perf/browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-browser-matrix
          path: ${{ runner.temp }}/kovo-perf/browser
          retention-days: 90

  dev-matrix:
    name: N=${{ matrix.corpus }} developer loop
    if: >-
      ${{ github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'baselines' || inputs.measurement_scope == 'all')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'perf-measure-baselines') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        corpus: [24, 216]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      - name: Install the isolated Next.js benchmark
        run: vp exec pnpm --dir benchmarks/nextjs install --ignore-workspace --frozen-lockfile
      - uses: ./.github/actions/playwright-install
        with:
          browsers: chromium
          cache-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      - name: Generate the matched corpus
        env:
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: vp exec node benchmarks/corpora/generate.mjs --sizes "$KOVO_PERF_CORPUS_SIZE"
      - name: Collect ready, edit, diagnostic, recovery and RSS evidence
        env:
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: >-
          vp exec node benchmarks/compare.mjs
          --cells dev
          --corpus-size "$KOVO_PERF_CORPUS_SIZE"
          --dev-ready-iterations 15
          --dev-iterations 30
          --dev-warmups 3
          --out-dir "$RUNNER_TEMP/kovo-perf/dev-n$KOVO_PERF_CORPUS_SIZE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-dev-n${{ matrix.corpus }}
          path: ${{ runner.temp }}/kovo-perf/dev-n${{ matrix.corpus }}
          retention-days: 90

  build-matrix:
    name: N=${{ matrix.corpus }} production builds
    if: >-
      ${{ github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'baselines' || inputs.measurement_scope == 'all')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'perf-measure-baselines') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        corpus: [24, 216]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      - name: Install the isolated Next.js benchmark
        run: vp exec pnpm --dir benchmarks/nextjs install --ignore-workspace --frozen-lockfile
      - name: Generate the matched corpus
        env:
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: vp exec node benchmarks/corpora/generate.mjs --sizes "$KOVO_PERF_CORPUS_SIZE"
      - name: Collect clean, unchanged and one-line-edit build evidence
        env:
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: >-
          vp exec node benchmarks/compare.mjs
          --cells build
          --corpus-size "$KOVO_PERF_CORPUS_SIZE"
          --iterations 10
          --warmups 3
          --out-dir "$RUNNER_TEMP/kovo-perf/build-n$KOVO_PERF_CORPUS_SIZE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-build-n${{ matrix.corpus }}
          path: ${{ runner.temp }}/kovo-perf/build-n${{ matrix.corpus }}
          retention-days: 90

  server-matrix:
    name: Matched production throughput
    if: >-
      ${{ github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'baselines' || inputs.measurement_scope == 'all')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'perf-measure-baselines') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      - name: Install the isolated Next.js benchmark
        run: vp exec pnpm --dir benchmarks/nextjs install --ignore-workspace --frozen-lockfile
      - name: Collect the complete alternating server matrix
        # The 504 fixed measurement windows consume 168 minutes. One 30-second quiet-host settle
        # budget is shared by the whole suite; it cannot multiply per window. The outer timeout
        # leaves thirty minutes for artifact upload before the job-level 360-minute cap.
        run: >-
          timeout --signal=TERM --kill-after=30s 330m
          vp exec node benchmarks/compare.mjs
          --cells server
          --server-samples 7
          --server-warmup-ms 5000
          --server-duration-ms 15000
          --server-host-settle-max-ms 30000
          --server-concurrencies 1,8,32
          --server-routes listing,detail
          --server-encodings identity,br
          --server-modes HIT,304,dynamic
          --out-dir "$RUNNER_TEMP/kovo-perf/server"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-server-matrix
          path: ${{ runner.temp }}/kovo-perf/server
          retention-days: 90

  check-watch-decision:
    name: Check-watch candidate decision
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'decisions' || inputs.measurement_scope == 'all') &&
      (inputs.decision_focus == 'all' || inputs.decision_focus == 'check-watch')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      (github.event.label.name == 'perf-measure-decisions' ||
      github.event.label.name == 'perf-measure-check-watch')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
          runner_digest="$({ printf '%s\n' "$ImageOS" "$ImageVersion"; cat /etc/os-release; } | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_DEVEX_OS_IMAGE=github-actions/ubuntu-24.04@sha256:%s\n' "$runner_digest" >> "$GITHUB_ENV"
          printf 'KOVO_DEVEX_RUNNER_NAME=github-hosted-ubuntu-24.04-accepted\n' >> "$GITHUB_ENV"
      - name: Expose pnpm to authenticated benchmark subprocesses
        run: |
          tool_bin="$RUNNER_TEMP/kovo-perf-tool-bin"
          mkdir -p "$tool_bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec vp exec pnpm "$@"' > "$tool_bin/pnpm"
          chmod 755 "$tool_bin/pnpm"
          printf '%s\n' "$tool_bin" >> "$GITHUB_PATH"
      - name: Authenticate and prepare exact sealed baseline and candidate scenarios
        env:
          KOVO_CHECK_WATCH_BASELINE_SHA: ${{ inputs.check_watch_baseline_sha || 'e3a78ca901035ada82a564943db808255c94ac82' }}
          KOVO_CHECK_WATCH_CANDIDATE_SHA: ${{ inputs.check_watch_candidate_sha || '2ce61f50b4df290796272e7ea836369e51537e22' }}
          KOVO_CHECK_WATCH_BASELINE_COMMIT: cc475b3ab2d54ff8201de059e713cc1d7e54400c
          KOVO_CHECK_WATCH_CANDIDATE_PRODUCTION_COMMIT: 0590083172c0cbdeef4d58219ea384da7cb9f985
          KOVO_CHECK_WATCH_EVIDENCE_REF: refs/heads/perf-spike/check-watch-repaired-sealed-20260814
        run: |
          baseline_root="$RUNNER_TEMP/kovo-check-watch-baseline"
          candidate_root="$RUNNER_TEMP/kovo-check-watch-candidate"
          assert_equal() {
            check_label="$1"
            expected="$2"
            actual="$3"
            if [ "$actual" != "$expected" ]; then
              printf 'check-watch authentication failed: %s (expected <%s>, got <%s>)\n' "$check_label" "$expected" "$actual" >&2
              exit 2
            fi
          }
          mkdir -p "$RUNNER_TEMP/kovo-perf/check-watch"
          case "$KOVO_CHECK_WATCH_BASELINE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo 'check_watch_baseline_sha must be exactly 40 lowercase hexadecimal characters' >&2; exit 2 ;;
          esac
          case "$KOVO_CHECK_WATCH_CANDIDATE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo 'check_watch_candidate_sha must be exactly 40 lowercase hexadecimal characters' >&2; exit 2 ;;
          esac
          git fetch --no-tags origin \
            "+$KOVO_CHECK_WATCH_EVIDENCE_REF:refs/perf-evidence/check-watch-sealed"
          baseline_commit="$(git rev-parse --verify "$KOVO_CHECK_WATCH_BASELINE_SHA^{commit}")"
          candidate_commit="$(git rev-parse --verify refs/perf-evidence/check-watch-sealed^{commit})"
          assert_equal 'resolved baseline seal commit' "$KOVO_CHECK_WATCH_BASELINE_SHA" "$baseline_commit"
          assert_equal 'resolved candidate evidence ref' "$KOVO_CHECK_WATCH_CANDIDATE_SHA" "$candidate_commit"
          assert_equal 'baseline seal parent' "$KOVO_CHECK_WATCH_BASELINE_COMMIT" "$(git rev-parse "$baseline_commit^")"
          git diff-tree --no-commit-id --name-only -r "$baseline_commit" | while IFS= read -r seal_path; do
            case "$seal_path" in
              packages/compiler/src/security/framework-public-runtime-export-posture.generated.ts|scripts/pack-security.files.json|security/framework-public-runtime-export-posture.json|security/kovo-certificate-policy-v1.json|security/kovo-certificate-v1.json) ;;
              *) echo "check-watch baseline seal changed unapproved path: $seal_path" >&2; exit 2 ;;
            esac
          done
          assert_equal 'candidate ancestry merge base' "$baseline_commit" "$(git merge-base "$baseline_commit" "$candidate_commit")"
          candidate_range_count="$(git rev-list --count "$baseline_commit..$candidate_commit")"
          assert_equal 'candidate sealed range commit count' 2 "$candidate_range_count"
          production_commit="$(git rev-list --reverse "$baseline_commit..$candidate_commit" | head -n 1)"
          assert_equal 'candidate production commit' "$KOVO_CHECK_WATCH_CANDIDATE_PRODUCTION_COMMIT" "$production_commit"
          assert_equal 'production commit parent' "$baseline_commit" "$(git rev-parse "$production_commit^")"
          assert_equal 'candidate seal parent' "$production_commit" "$(git rev-parse "$candidate_commit^")"
          sealed_changed_paths="$(git diff --name-only "$baseline_commit" "$production_commit")"
          assert_equal 'production changed-path count' 7 "$(printf '%s\n' "$sealed_changed_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          while IFS= read -r production_path; do
            case "$production_path" in
              packages/cli/src/commands/build-export.ts|packages/cli/src/commands/check-session-reuse.test.ts|packages/cli/src/commands/check-session-reuse.ts|packages/cli/src/commands/source-check-session.test.ts|packages/cli/src/commands/source-check-session.ts|packages/cli/src/commands/source-check-watch.test.ts|packages/cli/src/commands/source-check-watch.ts) ;;
              *) echo "check-watch candidate changed unapproved production path: $production_path" >&2; exit 2 ;;
            esac
          done <<< "$sealed_changed_paths"
          git diff-tree --no-commit-id --name-only -r "$candidate_commit" | while IFS= read -r seal_path; do
            case "$seal_path" in
              packages/compiler/src/security/framework-public-runtime-export-posture.generated.ts|scripts/pack-security.files.json|security/framework-public-runtime-export-posture.json|security/kovo-certificate-policy-v1.json|security/kovo-certificate-v1.json) ;;
              *) echo "check-watch candidate seal changed unapproved path: $seal_path" >&2; exit 2 ;;
            esac
          done
          git worktree add --detach "$baseline_root" "$baseline_commit"
          git worktree add --detach "$candidate_root" "$candidate_commit"
          vp exec pnpm --dir "$baseline_root" install --offline --frozen-lockfile --ignore-scripts
          vp exec pnpm --dir "$candidate_root" install --offline --frozen-lockfile --ignore-scripts
          KOVO_SOURCE_COMMIT="$baseline_commit" \
            vp exec node "$baseline_root/scripts/devex-benchmark.mjs" --prepare-kovo-scenario
          KOVO_SOURCE_COMMIT="$candidate_commit" \
            vp exec node "$candidate_root/scripts/devex-benchmark.mjs" --prepare-kovo-scenario
      - name: Run the full serialized check-watch decision
        run: >-
          vp exec node scripts/perf-check-watch-spike.mjs
          --baseline-scenario "$RUNNER_TEMP/kovo-check-watch-baseline/.release/devex/kovo-packed-scenario.json"
          --baseline-repo "$RUNNER_TEMP/kovo-check-watch-baseline"
          --spike-scenario "$RUNNER_TEMP/kovo-check-watch-candidate/.release/devex/kovo-packed-scenario.json"
          --spike-repo "$RUNNER_TEMP/kovo-check-watch-candidate"
          --samples 30
          --warmups 3
          --out "$RUNNER_TEMP/kovo-perf/check-watch/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-check-watch-decision
          path: ${{ runner.temp }}/kovo-perf/check-watch
          retention-days: 30

  dev-generation-decision:
    name: N=${{ matrix.corpus }} packed-product dev critical-path candidate decision
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'decisions' || inputs.measurement_scope == 'all') &&
      (inputs.decision_focus == 'all' || inputs.decision_focus == 'dev-generation')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      (github.event.label.name == 'perf-measure-decisions' ||
      github.event.label.name == 'perf-measure-dev-generation')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        corpus: [24, 216]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      - uses: ./.github/actions/playwright-install
        with:
          browsers: chromium
          cache-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      - name: Expose pnpm to authenticated benchmark subprocesses
        run: |
          tool_bin="$RUNNER_TEMP/kovo-perf-tool-bin"
          mkdir -p "$tool_bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec vp exec pnpm "$@"' > "$tool_bin/pnpm"
          chmod 755 "$tool_bin/pnpm"
          printf '%s\n' "$tool_bin" >> "$GITHUB_PATH"
      - name: Prepare exact baseline and profile-driven candidate source worktrees
        env:
          KOVO_DEV_GENERATION_CANDIDATE_COMMIT: 336925d40e11024b54206908997dbdfe0f43a391
          KOVO_DEV_GENERATION_CANDIDATE_REF: refs/heads/perf-spike/dev-critical-path-profile-20260814
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: |
          baseline_root="$RUNNER_TEMP/kovo-dev-generation-n$KOVO_PERF_CORPUS_SIZE-baseline"
          spike_root="$RUNNER_TEMP/kovo-dev-generation-n$KOVO_PERF_CORPUS_SIZE-spike"
          mkdir -p "$RUNNER_TEMP/kovo-perf/dev-generation-n$KOVO_PERF_CORPUS_SIZE"
          git fetch --no-tags origin \
            "+$KOVO_DEV_GENERATION_CANDIDATE_REF:refs/perf-evidence/dev-generation-candidate"
          resolved_candidate="$(git rev-parse --verify refs/perf-evidence/dev-generation-candidate^{commit})"
          test "$resolved_candidate" = "$KOVO_DEV_GENERATION_CANDIDATE_COMMIT"
          git worktree add --detach "$baseline_root" "$KOVO_PERF_SOURCE_SHA"
          git worktree add --detach "$spike_root" "$KOVO_PERF_SOURCE_SHA"
          git -C "$spike_root" \
            -c user.name='Kovo Performance CI' \
            -c user.email='performance-ci@kovo.invalid' \
            -c commit.gpgsign=false \
            cherry-pick "$KOVO_DEV_GENERATION_CANDIDATE_COMMIT"
          test "$(git -C "$spike_root" rev-parse HEAD^)" = "$KOVO_PERF_SOURCE_SHA"
          test "$(git -C "$spike_root" rev-list --count "$KOVO_PERF_SOURCE_SHA..HEAD")" = 1
          test -z "$(git -C "$baseline_root" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$spike_root" status --porcelain=v1 --untracked-files=all)"
      # The v3 runner prepares/builds/packs/frozen-installs one exact product per source worktree,
      # then generates and binds a separate deferred-dependency corpus under a fresh external temp
      # root before any timed block. The workflow must not pre-generate or link a checkout corpus.
      - name: Run the full packed-product browser-visible critical-path decision
        env:
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: >-
          vp exec node scripts/perf-dev-generation-spike.mjs
          --baseline-root "$RUNNER_TEMP/kovo-dev-generation-n$KOVO_PERF_CORPUS_SIZE-baseline"
          --spike-root "$RUNNER_TEMP/kovo-dev-generation-n$KOVO_PERF_CORPUS_SIZE-spike"
          --size "$KOVO_PERF_CORPUS_SIZE"
          --ready-samples 15
          --ready-timeout-ms 600000
          --edit-samples 30
          --warmups 3
          --timeout-ms 3600000
          --measure
          --out "$RUNNER_TEMP/kovo-perf/dev-generation-n$KOVO_PERF_CORPUS_SIZE/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-dev-generation-n${{ matrix.corpus }}
          path: ${{ runner.temp }}/kovo-perf/dev-generation-n${{ matrix.corpus }}
          retention-days: 30

