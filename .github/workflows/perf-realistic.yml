        with:
          browsers: chromium
          cache-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      - name: Generate the authenticated Kovo corpus
        env:
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: vp exec node benchmarks/corpora/generate.mjs --sizes "$KOVO_PERF_CORPUS_SIZE"
      - name: Collect diagnostic-only CPU and allocation profiles
        # scripts/perf-dev-edit-profile.mjs owns these Inspector windows. The profiled durations are
        # deliberately not candidate-acceptance evidence; ordinary unprofiled matrices own latency.
        env:
          KOVO_PERF_CORPUS_SIZE: ${{ matrix.corpus }}
        run: |
          output_root="$RUNNER_TEMP/kovo-perf/dev-profile-n$KOVO_PERF_CORPUS_SIZE"
          mkdir -p "$output_root/raw"
          case "$KOVO_PERF_CORPUS_SIZE" in
            24|216) ;;
            *) echo 'unsupported profiled corpus size' >&2; exit 2 ;;
          esac
          # Derive globally distinct exact ports below Linux's default 32768 ephemeral floor. The
          # adapter authenticates the actual Linux/macOS kernel ranges and refuses any overlap.
          dev_port=$((20000 + KOVO_PERF_CORPUS_SIZE))
          inspector_port=$((21000 + KOVO_PERF_CORPUS_SIZE))
          benchmark_status=0
          vp exec node benchmarks/corpora/dev-loop.mjs \
            --manifest "$GITHUB_WORKSPACE/benchmarks/kovo/.corpora/kovo/n$KOVO_PERF_CORPUS_SIZE/manifest.json" \
            --iterations 3 \
            --ready-iterations 1 \
            --warmups 3 \
            --port "$dev_port" \
            --inspector-port "$inspector_port" \
            --ready-timeout-ms 600000 \
            --profile-dir "$output_root/raw" \
            --out "$output_root/report.json" || benchmark_status=$?
          audit_status=0
          vp exec node scripts/perf-dev-edit-profile-audit.mjs \
            --report "$output_root/report.json" \
            --profile-dir "$output_root/raw" \
            --out "$output_root/audit.json" \
            --require-provider github-actions || audit_status=$?
          test "$benchmark_status" -eq 0
          test "$audit_status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-dev-profile-n${{ matrix.corpus }}
          path: ${{ runner.temp }}/kovo-perf/dev-profile-n${{ matrix.corpus }}
          retention-days: 30

  build-profile:
    name: N=216 build CPU profiles
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'decisions' || inputs.measurement_scope == 'all') &&
      (inputs.decision_focus == 'all' || inputs.decision_focus == 'build-profile')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      (github.event.label.name == 'perf-measure-decisions' ||
      github.event.label.name == 'perf-measure-build-profile')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Provision the process-tree tracer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
          test "$(command -v strace)" = /usr/bin/strace
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      - name: Generate the authenticated N=216 Kovo corpus
        run: vp exec node benchmarks/corpora/generate.mjs --sizes 216
      - name: Collect diagnostic-only warm-build process profiles
        # SPEC §5.2 rule 9: this runs the ordinary one-shot build for every warmup and profiled
        # sample. Profiled durations are intentionally absent from the report and decision policy.
        run: >-
          vp exec node scripts/perf-build-session-profile.mjs
          --corpus "$GITHUB_WORKSPACE/benchmarks/kovo/.corpora/kovo/n216/manifest.json"
          --out-dir "$RUNNER_TEMP/kovo-perf/build-profile-n216"
          --require-provider github-actions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-build-profile-n216
          path: ${{ runner.temp }}/kovo-perf/build-profile-n216
          retention-days: 30

  loader-runtime-memo-decision:
    name: Loader-runtime memo candidate decision
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
      (inputs.measurement_scope == 'decisions' || inputs.measurement_scope == 'all') &&
      (inputs.decision_focus == 'all' || inputs.decision_focus == 'loader')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      (github.event.label.name == 'perf-measure-decisions' ||
      github.event.label.name == 'perf-measure-loader')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.KOVO_PERF_SOURCE_SHA }}
      - name: Authenticate checked-out performance source
        run: test "$(git rev-parse HEAD)" = "$KOVO_PERF_SOURCE_SHA"
      - uses: ./.github/actions/kovo-setup
      - name: Bind the report to the runner image
        run: |
          : "${ImageOS:?GitHub hosted runner did not expose ImageOS}"
          : "${ImageVersion:?GitHub hosted runner did not expose ImageVersion}"
          image_version_digest="$(printf '%s' "$ImageVersion" | sha256sum | cut -d' ' -f1)"
          printf 'KOVO_PERF_RUNNER_IMAGE=github-actions/ubuntu-24.04 ImageOS=%s ImageVersionDigest=sha256:%s\n' "$ImageOS" "$image_version_digest" >> "$GITHUB_ENV"
      - name: Expose pnpm to authenticated benchmark subprocesses
        run: |
          tool_bin="$RUNNER_TEMP/kovo-perf-tool-bin"
          mkdir -p "$tool_bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec vp exec pnpm "$@"' > "$tool_bin/pnpm"
          chmod 755 "$tool_bin/pnpm"
          printf '%s\n' "$tool_bin" >> "$GITHUB_PATH"
      - name: Authenticate historical evidence and prepare exact candidate worktrees
        env:
          KOVO_LOADER_BASELINE_SHA: ${{ inputs.loader_baseline_sha || '3010e8df33869413727003c659bb555ac824d104' }}
          KOVO_LOADER_CANDIDATE_SHA: ${{ inputs.loader_candidate_sha || 'd87b4a1320087c512e25f02a57e88920ae9b1777' }}
          KOVO_LOADER_HISTORICAL_COMMIT: e54c595b5906df9ab9b9b5e3fbf18e76c99e79b9
          KOVO_LOADER_HISTORICAL_REF: refs/heads/perf-spike/loader-memo-e54c595b5
          KOVO_LOADER_PROFILED_PAIR_REF: refs/heads/perf-spike/loader-memo-profiled-pair-20260813
        run: |
          baseline_root="$RUNNER_TEMP/kovo-loader-runtime-memo-baseline"
          spike_root="$RUNNER_TEMP/kovo-loader-runtime-memo-spike"
          mkdir -p "$RUNNER_TEMP/kovo-perf/loader-runtime-memo"
          case "$KOVO_LOADER_BASELINE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo 'loader_baseline_sha must be exactly 40 lowercase hexadecimal characters' >&2; exit 2 ;;
          esac
          case "$KOVO_LOADER_CANDIDATE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo 'loader_candidate_sha must be exactly 40 lowercase hexadecimal characters' >&2; exit 2 ;;
          esac
          git fetch --no-tags origin \
            "+$KOVO_LOADER_HISTORICAL_REF:refs/perf-evidence/loader-memo-historical" \
            "+$KOVO_LOADER_PROFILED_PAIR_REF:refs/perf-evidence/loader-memo-profiled-pair"
          resolved_historical="$(git rev-parse --verify refs/perf-evidence/loader-memo-historical^{commit})"
          test "$resolved_historical" = "$KOVO_LOADER_HISTORICAL_COMMIT"
          resolved_profiled_pair="$(git rev-parse --verify refs/perf-evidence/loader-memo-profiled-pair^{commit})"
          test "$resolved_profiled_pair" = "$KOVO_LOADER_CANDIDATE_SHA"
          baseline_commit="$(git rev-parse --verify "$KOVO_LOADER_BASELINE_SHA^{commit}")"
          candidate_commit="$(git rev-parse --verify "$KOVO_LOADER_CANDIDATE_SHA^{commit}")"
          test "$baseline_commit" = "$KOVO_LOADER_BASELINE_SHA"
          test "$candidate_commit" = "$KOVO_LOADER_CANDIDATE_SHA"
          test "$(git rev-parse "$candidate_commit^")" = "$baseline_commit"
          test "$(git merge-base "$baseline_commit" "$candidate_commit")" = "$baseline_commit"
          test "$(git rev-list --count "$baseline_commit..$candidate_commit")" = 1
          git merge-base --is-ancestor "$candidate_commit" "$KOVO_PERF_SOURCE_SHA"
          git worktree add --detach "$baseline_root" "$baseline_commit"
          git worktree add --detach "$spike_root" "$candidate_commit"
          test "$(git -C "$baseline_root" rev-parse HEAD)" = "$baseline_commit"
          test "$(git -C "$spike_root" rev-parse HEAD)" = "$candidate_commit"
          vp exec pnpm --dir "$baseline_root" install --offline --frozen-lockfile --ignore-scripts
          vp exec pnpm --dir "$spike_root" install --offline --frozen-lockfile --ignore-scripts
          vp exec node scripts/perf-loader-runtime-memo-ab.mjs \
            --baseline-root "$baseline_root" \
            --spike-root "$spike_root" \
            --prepare-only \
            --profile-dir "$RUNNER_TEMP/kovo-perf/loader-runtime-memo/profiles" \
            --out "$RUNNER_TEMP/kovo-perf/loader-runtime-memo/prepare.json"
      - name: Run the full forced-dynamic loader-runtime decision and profiles
        run: >-
          vp exec node scripts/perf-loader-runtime-memo-ab.mjs
          --baseline-root "$RUNNER_TEMP/kovo-loader-runtime-memo-baseline"
          --spike-root "$RUNNER_TEMP/kovo-loader-runtime-memo-spike"
          --measure
          --samples 7
          --warmup-ms 5000
          --duration-ms 15000
          --concurrencies 1,8,32
          --routes listing,detail
          --profile-dir "$RUNNER_TEMP/kovo-perf/loader-runtime-memo/profiles"
          --out "$RUNNER_TEMP/kovo-perf/loader-runtime-memo/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: warn
          name: kovo-perf-loader-runtime-memo-decision
          path: ${{ runner.temp }}/kovo-perf/loader-runtime-memo
          retention-days: 30
