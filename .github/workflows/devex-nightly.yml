name: DevEx Nightly

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      ratify_hosted_budgets:
        description: Collect one-runner N=5 evidence and produce a transactional budget candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: devex-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --experimental-transform-types --disable-warning=ExperimentalWarning
  PLAYWRIGHT_VERSION: 1.60.0

jobs:
  package-producer:
    # devex-gate: nightly-package-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/kovo-setup
      - name: Enforce declared DevEx cadence and runner-minute caps
        run: vp exec node scripts/devex-ci-policy.mjs
      - name: Build authenticated public tarballs
        run: vp exec pnpm run check:publish
      - name: Archive authenticated packed release
        run: >-
          tar -czf "$RUNNER_TEMP/kovo-packed-release.tgz"
          .release/packed-packages.json
          .release/tarballs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kovo-devex-packed-release
          path: ${{ runner.temp }}/kovo-packed-release.tgz
          retention-days: 7

  benchmark:
    # devex-gate: nightly-benchmark
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ratify_hosted_budgets != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/kovo-setup
      - name: Identify the accepted hosted runner
        run: |
          runner_digest="$(
            {
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              cat /etc/os-release
            } | sha256sum | cut -d' ' -f1
          )"
          echo "KOVO_DEVEX_OS_IMAGE=github-actions/ubuntu-24.04@sha256:$runner_digest" >> "$GITHUB_ENV"
          echo "KOVO_DEVEX_RUNNER_NAME=github-hosted-ubuntu-24.04-accepted" >> "$GITHUB_ENV"
      - name: Collect and evaluate the five-sample authenticated baseline
        run: |
          mkdir -p "$RUNNER_TEMP/kovo-devex-baseline"
          vp exec node scripts/devex-benchmark.mjs --prepare-kovo-scenario
          vp exec node scripts/devex-benchmark.mjs --scenario .release/devex/kovo-packed-scenario.json --samples 5 --output "$RUNNER_TEMP/kovo-devex-baseline/benchmark.json" --evaluate --require-ratified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: error
          name: kovo-devex-baseline
          path: ${{ runner.temp }}/kovo-devex-baseline
          retention-days: 30

  packed-journeys:
    # devex-gate: nightly-packed-journeys
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ratify_hosted_budgets != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - package-producer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/kovo-setup
        with:
          rebuild-better-sqlite3: 'true'
      - name: Identify the accepted hosted runner
        run: |
          runner_digest="$(
            {
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              cat /etc/os-release
            } | sha256sum | cut -d' ' -f1
          )"
          echo "KOVO_DEVEX_OS_IMAGE=github-actions/ubuntu-24.04@sha256:$runner_digest" >> "$GITHUB_ENV"
          echo "KOVO_DEVEX_RUNNER_NAME=github-hosted-ubuntu-24.04-accepted" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kovo-devex-packed-release
          path: ${{ runner.temp }}/kovo-devex-packed-release
      - name: Restore authenticated packed release
        run: tar -xzf "$RUNNER_TEMP/kovo-devex-packed-release/kovo-packed-release.tgz" -C .
      - uses: ./.github/actions/playwright-install
        with:
          browsers: chromium
          cache-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      - name: Exercise both packed starters and the strict-offline agent
        run: >-
          vp exec node scripts/golden-journey.mjs --scenario release-scorecard --samples 5 --report "$RUNNER_TEMP/kovo-devex-golden/report.json" --artifacts "$RUNNER_TEMP/kovo-devex-golden/failures" --budgets devex-budgets.json --evaluate --require-ratified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: error
          name: kovo-devex-golden-journey
          path: ${{ runner.temp }}/kovo-devex-golden
          include-hidden-files: true
          retention-days: 14

  full-catalog:
    # devex-gate: nightly-full-catalog
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ratify_hosted_budgets != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
      - package-producer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/kovo-setup
        with:
          rebuild-better-sqlite3: 'true'
      - name: Identify the accepted hosted runner
        run: |
          runner_digest="$(
            {
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              cat /etc/os-release
            } | sha256sum | cut -d' ' -f1
          )"
          echo "KOVO_DEVEX_OS_IMAGE=github-actions/ubuntu-24.04@sha256:$runner_digest" >> "$GITHUB_ENV"
          echo "KOVO_DEVEX_RUNNER_NAME=github-hosted-ubuntu-24.04-accepted" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kovo-devex-packed-release
          path: ${{ runner.temp }}/kovo-devex-packed-release
      - name: Restore authenticated packed release
        run: tar -xzf "$RUNNER_TEMP/kovo-devex-packed-release/kovo-packed-release.tgz" -C .
      - name: Collect five authenticated full-catalog RSS samples
        run: |
          mkdir -p "$RUNNER_TEMP/kovo-devex-full-catalog"
          vp exec node scripts/full-catalog-reproducer.mjs --samples 5 --output "$RUNNER_TEMP/kovo-devex-full-catalog/report.json" --artifacts "$RUNNER_TEMP/kovo-devex-full-catalog/failures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: error
          name: kovo-devex-full-catalog
          path: ${{ runner.temp }}/kovo-devex-full-catalog
          include-hidden-files: true
          retention-days: 30

  hosted-ratification:
    # devex-gate: manual-hosted-ratification
    if: ${{ inputs.ratify_hosted_budgets }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    needs:
      - package-producer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/kovo-setup
        with:
          rebuild-better-sqlite3: 'true'
      - name: Identify the accepted hosted runner
        run: |
          runner_digest="$(
            {
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              cat /etc/os-release
            } | sha256sum | cut -d' ' -f1
          )"
          echo "KOVO_DEVEX_OS_IMAGE=github-actions/ubuntu-24.04@sha256:$runner_digest" >> "$GITHUB_ENV"
          echo "KOVO_DEVEX_RUNNER_NAME=github-hosted-ubuntu-24.04-accepted" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kovo-devex-packed-release
          path: ${{ runner.temp }}/kovo-devex-packed-release
      - name: Restore authenticated packed release
        run: tar -xzf "$RUNNER_TEMP/kovo-devex-packed-release/kovo-packed-release.tgz" -C .
      - uses: ./.github/actions/playwright-install
        with:
          browsers: chromium
          cache-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-key: kovo-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-
      - name: Create the one-runner audit workspace
        run: |
          mkdir -p "$RUNNER_TEMP/kovo-devex-ratification/proposals" "$RUNNER_TEMP/kovo-devex-ratification/golden/failures" "$RUNNER_TEMP/kovo-devex-ratification/full-catalog/failures"
          cp devex-budgets.json "$RUNNER_TEMP/kovo-devex-ratification/inherited-devex-budgets.json"
      - name: Prepare the authenticated benchmark scenario
        run: vp exec node scripts/devex-benchmark.mjs --prepare-kovo-scenario
      - name: Collect five benchmark samples without pre-claiming ratification
        run: vp exec node scripts/devex-benchmark.mjs --scenario .release/devex/kovo-packed-scenario.json --samples 5 --output "$RUNNER_TEMP/kovo-devex-ratification/benchmark.json" --evaluate
      - name: Collect five dual-dialect journey samples on the same runner
        run: vp exec node scripts/golden-journey.mjs --scenario release-scorecard --samples 5 --report "$RUNNER_TEMP/kovo-devex-ratification/golden/report.json" --artifacts "$RUNNER_TEMP/kovo-devex-ratification/golden/failures" --budgets devex-budgets.json --evaluate
      - name: Collect five full-catalog samples on the same runner
        run: vp exec node scripts/full-catalog-reproducer.mjs --samples 5 --output "$RUNNER_TEMP/kovo-devex-ratification/full-catalog/report.json" --artifacts "$RUNNER_TEMP/kovo-devex-ratification/full-catalog/failures"
      - name: Bind reviewed targets to each exact report runner
        run: |
          vp exec node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const root = process.env.RUNNER_TEMP;
          const policy = JSON.parse(readFileSync('devex-baseline-policy.json', 'utf8'));
          const reports = {
            benchmark: path.join(root, 'kovo-devex-ratification/benchmark.json'),
            'golden-journey': path.join(root, 'kovo-devex-ratification/golden/report.json'),
            'full-catalog': path.join(root, 'kovo-devex-ratification/full-catalog/report.json'),
          };
          for (const [source, reportPath] of Object.entries(reports)) {
            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            const proposal = {
              schema: policy.ratification.proposalSchema,
              runnerFingerprint: report.runner,
              metrics: policy.ratification.targetProposals[source],
            };
            writeFileSync(
              path.join(root, `kovo-devex-ratification/proposals/${source}.json`),
              `${JSON.stringify(proposal, null, 2)}\n`,
            );
          }
          NODE
      - name: Prove the checkout is clean before authentication
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Ratify all reports in one atomic budget transaction
        run: vp exec node scripts/devex-benchmark.mjs --ratify --budgets devex-budgets.json --baseline "$RUNNER_TEMP/kovo-devex-ratification/benchmark.json" --proposal "$RUNNER_TEMP/kovo-devex-ratification/proposals/benchmark.json" --baseline-record-path baselines/devex-hosted-benchmark-v1.json --baseline "$RUNNER_TEMP/kovo-devex-ratification/golden/report.json" --proposal "$RUNNER_TEMP/kovo-devex-ratification/proposals/golden-journey.json" --baseline-record-path baselines/devex-hosted-golden-journey-v1.json --baseline "$RUNNER_TEMP/kovo-devex-ratification/full-catalog/report.json" --proposal "$RUNNER_TEMP/kovo-devex-ratification/proposals/full-catalog.json" --baseline-record-path baselines/devex-hosted-full-catalog-v1.json --write
      - name: Assemble and validate the reviewable candidate
        env:
          KOVO_DEVEX_CANDIDATE_ROOT: ${{ runner.temp }}/kovo-devex-ratification/candidate
          KOVO_DEVEX_INHERITED_BUDGETS: ${{ runner.temp }}/kovo-devex-ratification/inherited-devex-budgets.json
        run: |
          mkdir -p "$KOVO_DEVEX_CANDIDATE_ROOT/baselines"
          cp devex-budgets.json "$KOVO_DEVEX_CANDIDATE_ROOT/devex-budgets.json"
          cp "$RUNNER_TEMP/kovo-devex-ratification/benchmark.json" "$KOVO_DEVEX_CANDIDATE_ROOT/baselines/devex-hosted-benchmark-v1.json"
          cp "$RUNNER_TEMP/kovo-devex-ratification/golden/report.json" "$KOVO_DEVEX_CANDIDATE_ROOT/baselines/devex-hosted-golden-journey-v1.json"
          cp "$RUNNER_TEMP/kovo-devex-ratification/full-catalog/report.json" "$KOVO_DEVEX_CANDIDATE_ROOT/baselines/devex-hosted-full-catalog-v1.json"
          vp exec node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          import { createRatifiedDevexBaselinePolicyCandidate } from './scripts/devex-ci-policy.mjs';

          const checkoutPolicy = JSON.parse(readFileSync('devex-baseline-policy.json', 'utf8'));
          const candidatePolicy = createRatifiedDevexBaselinePolicyCandidate(checkoutPolicy);
          writeFileSync(
            path.join(process.env.KOVO_DEVEX_CANDIDATE_ROOT, 'devex-baseline-policy.json'),
            `${JSON.stringify(candidatePolicy, null, 2)}\n`,
            { flag: 'wx', mode: 0o600 },
          );
          NODE
          vp exec node scripts/devex-benchmark.mjs --check-budgets --budgets "$KOVO_DEVEX_CANDIDATE_ROOT/devex-budgets.json" --inherited-budgets "$KOVO_DEVEX_INHERITED_BUDGETS" --inherited-provenance-root "$GITHUB_WORKSPACE"
          vp exec node scripts/devex-ci-policy.mjs --candidate-root "$KOVO_DEVEX_CANDIDATE_ROOT"
          git diff --check -- devex-budgets.json
          actual_status="$(git status --porcelain=v1 --untracked-files=all)"
          test "$actual_status" = ' M devex-budgets.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          if-no-files-found: error
          name: kovo-devex-ratification-audit
          path: ${{ runner.temp }}/kovo-devex-ratification
          include-hidden-files: true
          retention-days: 30
